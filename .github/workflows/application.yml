name: Application foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.19.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate repository harness
        run: pnpm check:harness
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Verify reproducible fixture assets and documents
        run: |
          pnpm --filter @studio/test-fixtures check:assets
          pnpm --filter @studio/test-fixtures check:documents
      - name: Build standalone demo and Windows application
        run: pnpm build
      - name: Smoke-test packaged Electron application
        run: pnpm test:desktop
      - name: Verify standalone browser preview
        run: pnpm test:runtime
      - name: Preserve smoke-test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-smoke-evidence
          path: |
            test-results/**/desktop-*.png
            test-results/**/electron-diagnostics.json
            test-results/**/runtime-preview.png
            test-results/**/test-failed-*.png
            test-results/**/runtime-diagnostics.json
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
