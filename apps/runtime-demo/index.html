<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'" />
    <title>Slot Animation Studio Runtime Demo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="demo-shell">
      <header class="demo-header">
        <div>
          <p class="demo-label">Slot Animation Studio</p>
          <h1>Runtime Demo</h1>
        </div>
        <span class="demo-badge">Original priest fixture</span>
      </header>
      <section class="demo-viewport" aria-label="Priest animation viewport">
        <div id="viewport"></div>
        <div class="demo-guide-label">320 × 480 / Weighted priest preview</div>
        <p class="demo-message" id="message">Preparing canvas…</p>
      </section>
      <div class="transport-controls" role="group" aria-label="Animation preview controls">
        <label class="clip-control">Clip <select id="clip" aria-label="Animation clip" disabled></select></label>
        <button id="play" type="button" disabled>Play</button>
        <button id="stop" type="button" disabled>Stop</button>
        <input id="seek" type="range" aria-label="Seek animation" min="0" max="2" step="0.001" value="0" disabled />
        <output id="time" data-testid="playback-time" aria-label="Playback time" aria-live="off">0.00 s</output>
        <label>Speed <select id="speed" aria-label="Playback speed" disabled>
          <option value="0">0×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
        </select></label>
        <label>Fade <select id="fade" aria-label="Crossfade duration" disabled>
          <option value="0">0 s</option><option value="0.2" selected>0.2 s</option><option value="0.5">0.5 s</option><option value="1">1 s</option><option value="2">2 s</option>
        </select></label>
      </div>
      <footer class="demo-footer">
        <span id="status" role="status">Preparing canvas</span>
        <span>Shared weighted geometry · Preview only</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
